<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Colorfly Studio Generator</title>

    <link rel="stylesheet" href="./css/styles.css">
    <script src="./JavaScript/script.js" defer></script>
</head>
<body>
<header>
    <h1>Colorfly Generator</h1>
    <p>Tu paleta ideal a un click de distancia</p>
</header>

<main>
  <section class="controles">
    <h2>Crea sin límites</h2>

    <div class="configuracion">
        <label for="cantidad-colores">Cantidad de colores:</label>

        <select id="cantidad-colores">
            <option value="6">6 colores</option>
            <option value="8">8 colores</option>
            <option value="9">9 colores</option>
        </select>

        <label for="formato-color">Formato de color:</label>

        <select id="formato-color">
            <option value="HEX">HEX</option>
            <option value="HSL">HSL</option>
            <option value="RGBA">RGBA</option>
        </select>

         <button id="generar-paleta">Generar paleta</button>
         
    </div>
  </section>

  <section class="galeria">
    <h2>Tu paleta de colores</h2>

    <div id="paleta" class="paleta">
        <!-- Los colores se generarán dinámicamente con JavaScript -->
    </div>
  </section>

</main>
</body>
</html>
